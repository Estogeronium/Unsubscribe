<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Статистика — Отписаться</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Spectral:wght@500;600&family=JetBrains+Mono:wght@400;500&display=swap"
    />
    <style>
      :root {
        color-scheme: light;
        --bg: #f4f4f7;
        --surface: #fff;
        --surface-2: #fafafb;
        --ink: #1a1a23;
        --ink-2: #54545f;
        --muted: #8b8b98;
        --line: rgba(20, 20, 45, 0.1);
        --line-strong: rgba(20, 20, 45, 0.17);
        --accent: #5b5bd6;
        --accent-wash: rgba(91, 91, 214, 0.12);
        --danger: #d23a40;
        --ok: #2f9461;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: var(--bg);
        color: var(--ink-2);
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 15px;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
        padding: 40px 20px 72px;
      }
      main {
        max-width: 620px;
        margin: 0 auto;
      }
      .head {
        margin-bottom: 26px;
      }
      h1 {
        font-family: "Spectral", Georgia, serif;
        font-weight: 600;
        font-size: 28px;
        letter-spacing: -0.01em;
        color: var(--ink);
      }
      .sub {
        font-size: 12.5px;
        color: var(--muted);
        margin-top: 6px;
      }
      .mono {
        font-family: "JetBrains Mono", ui-monospace, Menlo, monospace;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 10px;
        margin-bottom: 26px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 14px;
        padding: 16px 14px;
      }
      .card b {
        display: block;
        font-family: "Spectral", Georgia, serif;
        font-weight: 600;
        font-size: 26px;
        color: var(--ink);
        line-height: 1.1;
      }
      .card span {
        display: block;
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 5px;
      }

      section {
        margin-bottom: 28px;
      }
      h2 {
        font-family: "JetBrains Mono", monospace;
        font-size: 10.5px;
        text-transform: uppercase;
        letter-spacing: 0.09em;
        color: var(--muted);
        font-weight: 500;
        margin-bottom: 12px;
      }

      .funnel {
        display: flex;
        flex-direction: column;
        gap: 3px;
      }
      .row {
        position: relative;
        display: grid;
        grid-template-columns: 26px 1fr auto;
        align-items: center;
        gap: 10px;
        padding: 7px 10px;
        border-radius: 8px;
        background: var(--surface);
        border: 1px solid var(--line);
        overflow: hidden;
      }
      .row .bar {
        position: absolute;
        inset: 0 auto 0 0;
        background: var(--accent-wash);
        z-index: 0;
      }
      .row > * {
        position: relative;
        z-index: 1;
      }
      .row .n {
        font-family: "JetBrains Mono", monospace;
        font-size: 11px;
        color: var(--muted);
      }
      .row .name {
        font-size: 13px;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .row .val {
        font-family: "JetBrains Mono", monospace;
        font-size: 12px;
        color: var(--ink-2);
        text-align: right;
      }
      .row .val i {
        color: var(--muted);
        font-style: normal;
        font-size: 11px;
      }
      .row.done {
        border-color: var(--accent);
      }
      .row.done .bar {
        background: var(--accent-wash);
      }
      .row.done .name {
        font-weight: 600;
      }

      .drops {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .drop {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 11px 13px;
        font-size: 13px;
      }
      .drop b {
        color: var(--ink);
        font-weight: 500;
      }
      .drop .lost {
        font-family: "JetBrains Mono", monospace;
        color: var(--danger);
        white-space: nowrap;
      }
      .drop small {
        display: block;
        color: var(--muted);
        font-size: 11.5px;
      }

      .kv {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .kv div {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .kv b {
        font-family: "Spectral", Georgia, serif;
        font-weight: 600;
        font-size: 19px;
        color: var(--ink);
      }
      .kv span {
        display: block;
        font-size: 11.5px;
        color: var(--muted);
        margin-top: 3px;
      }

      .note {
        font-size: 12px;
        color: var(--muted);
        text-align: center;
        margin-top: 30px;
      }
      .state {
        text-align: center;
        color: var(--muted);
        font-size: 13.5px;
        padding: 50px 0;
      }
      [hidden] {
        display: none !important;
      }
      @media (max-width: 460px) {
        .cards,
        .kv {
          grid-template-columns: 1fr 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="head">
        <h1>Статистика «Отписаться»</h1>
        <p class="sub" id="sub">Обезличенные счётчики. Страница не в поиске и без ссылок.</p>
      </div>

      <p class="state" id="state">Загружаем…</p>

      <div id="board" hidden>
        <div class="cards">
          <div class="card"><b id="c-start">—</b><span>запусков игры</span></div>
          <div class="card"><b id="c-done">—</b><span>дошли до конца</span></div>
          <div class="card"><b id="c-conv">—</b><span>конверсия</span></div>
        </div>

        <section>
          <h2>Воронка по уровням</h2>
          <div class="funnel" id="funnel"></div>
        </section>

        <section id="drops-wrap">
          <h2>Где чаще всего бросают</h2>
          <div class="drops" id="drops"></div>
        </section>

        <section id="time-wrap">
          <h2>У тех, кто дошёл до конца</h2>
          <div class="kv">
            <div><b id="t-median">—</b><span>медианное время</span></div>
            <div><b id="t-avg">—</b><span>среднее время</span></div>
            <div><b id="t-min">—</b><span>самое быстрое</span></div>
            <div><b id="t-clicks">—</b><span>среднее число кликов</span></div>
          </div>
        </section>

        <p class="note" id="note"></p>
      </div>
    </main>

    <script>
      var API = "https://stats-api.vonzvyagin.ru/stats.json";

      var LEVELS = [
        "Настройки", "Cookie-баннер", "«Уже уходите?»", "Скидка −75%", "Опрос",
        "Чат-бот Стеша", "Капча", "Ожидание оператора", "SMS-код", "Пятнашки",
        "Ползунок", "Условия", "Лабиринт", "Отключить услуги", "Звонок основателя",
        "Понижение тарифа", "Почерк", "Удержать кнопку", "Точность", "Готово… почти",
      ];

      function nf(n) {
        return (n || 0).toLocaleString("ru-RU");
      }
      function secFmt(s) {
        if (s == null) return "—";
        s = Math.round(s);
        var m = Math.floor(s / 60);
        var r = s % 60;
        if (m === 0) return r + " с";
        return m + " мин " + (r < 10 ? "0" + r : r) + " с";
      }
      function dateFmt(ts) {
        if (!ts) return "";
        try {
          var now = new Date();
          var d = new Date(ts);
          var opts = { day: "numeric", month: "long" };
          if (d.getFullYear() !== now.getFullYear()) opts.year = "numeric";
          return d.toLocaleDateString("ru-RU", opts).replace(/\s*г\.$/, "");
        } catch (e) {
          return "";
        }
      }
      function timeFmt(ts) {
        try {
          return new Date(ts).toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
        } catch (e) {
          return "";
        }
      }

      function render(d) {
        var reached = d.levelReached || {};
        var fails = d.fails || {};
        var comp = d.completion || {};
        var completed = comp.n || 0;

        var started = (d.totals && d.totals.start) || reached[1] || 0;
        if ((reached[1] || 0) > started) started = reached[1];

        if (started === 0) {
          document.getElementById("state").textContent =
            "Пока пусто. Данные появятся, когда в игру кто-нибудь зайдёт.";
          return;
        }

        document.getElementById("state").hidden = true;
        document.getElementById("board").hidden = false;

        document.getElementById("c-start").textContent = nf(started);
        document.getElementById("c-done").textContent = nf(completed);
        document.getElementById("c-conv").textContent =
          Math.round((completed / started) * 100) + "%";

        // Воронка: 20 уровней + финал
        var maxRef = started;
        var html = "";
        var steps = [];
        for (var i = 1; i <= 20; i++) {
          steps.push({ label: "Ур. " + i + " · " + LEVELS[i - 1], n: reached[i] || 0, idx: i });
        }
        steps.push({ label: "Отписались", n: completed, idx: 21, done: true });

        var funnel = document.getElementById("funnel");
        funnel.innerHTML = steps
          .map(function (s) {
            var pct = maxRef ? Math.min(100, (s.n / maxRef) * 100) : 0;
            var share = maxRef ? Math.round((s.n / maxRef) * 100) : 0;
            return (
              '<div class="row' + (s.done ? " done" : "") + '">' +
              '<span class="bar" style="width:' + pct.toFixed(1) + '%"></span>' +
              '<span class="n">' + (s.idx <= 20 ? s.idx : "🏁") + "</span>" +
              '<span class="name">' + s.label + "</span>" +
              '<span class="val">' + nf(s.n) + " <i>· " + share + "%</i></span>" +
              "</div>"
            );
          })
          .join("");

        // Где бросают: наибольший отток между соседними шагами
        var drops = [];
        for (var j = 0; j < steps.length - 1; j++) {
          var lost = steps[j].n - steps[j + 1].n;
          if (lost > 0) {
            drops.push({
              from: steps[j],
              lost: lost,
              fails: fails[steps[j].idx] || 0,
            });
          }
        }
        drops.sort(function (a, b) {
          return b.lost - a.lost;
        });
        var top = drops.slice(0, 5);
        var dwrap = document.getElementById("drops-wrap");
        if (!top.length) {
          dwrap.hidden = true;
        } else {
          dwrap.hidden = false;
          document.getElementById("drops").innerHTML = top
            .map(function (x) {
              var name = x.from.idx <= 20 ? "Уровень " + x.from.idx + " — " + LEVELS[x.from.idx - 1] : x.from.label;
              var f = x.fails
                ? "<small>из них " + nf(x.fails) + " выбрали «остаться»</small>"
                : "";
              return (
                '<div class="drop"><div><b>' + name + "</b>" + f + "</div>" +
                '<span class="lost">−' + nf(x.lost) + "</span></div>"
              );
            })
            .join("");
        }

        // Время
        var tw = document.getElementById("time-wrap");
        if (!completed) {
          tw.hidden = true;
        } else {
          tw.hidden = false;
          document.getElementById("t-median").textContent = secFmt(comp.medianSec);
          document.getElementById("t-avg").textContent = secFmt(comp.avgSec);
          document.getElementById("t-min").textContent = secFmt(comp.minSec);
          document.getElementById("t-clicks").textContent =
            comp.avgClicks != null ? nf(comp.avgClicks) : "—";
        }

        var since = dateFmt(d.since);
        document.getElementById("sub").textContent =
          "Обезличенные счётчики" + (since ? ", данные с " + since : "") + ". Страница не в поиске и без ссылок.";
        document.getElementById("note").textContent =
          "Обновлено в " + timeFmt(d.updated) + " · страница сама обновляется раз в минуту";
      }

      function load() {
        fetch(API, { cache: "no-store" })
          .then(function (r) {
            if (!r.ok) throw new Error(r.status);
            return r.json();
          })
          .then(render)
          .catch(function () {
            var s = document.getElementById("state");
            s.hidden = false;
            s.textContent = "Не удалось загрузить данные. Сборщик ещё не настроен или недоступен.";
          });
      }

      load();
      setInterval(load, 60000);
    </script>
  </body>
</html>

<meta name="description" content="Одна цель — отменить подписку «Флюс». Между вами и кнопкой — тёмные паттерны. Таймер идёт." />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;450;500;600&family=Spectral:ital,wght@0,500;0,600;1,400&family=JetBrains+Mono:wght@400;500&display=swap" />

<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f7; --surface: #ffffff; --surface-2: #fafafb;
    --ink: #1a1a23; --ink-2: #54545f; --muted: #8b8b98;

    --danger: #d23a40; --ok: #2f9461; --gold: #e8b54a;
    --evil: #b6b6c0; --evil-bg: #ececef;
    --shadow-sm: 0 1px 2px rgba(20, 20, 45, 0.05);
    --shadow-lg: 0 1px 3px rgba(20, 20, 45, 0.06), 0 18px 48px rgba(20, 20, 45, 0.13);
    --r-card: 18px; --r-ctl: 12px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #0b0b0e; --surface: #151519; --surface-2: #101014;
      --ink: #f1f1f4; --ink-2: #afafbb; --muted: #7a7a88;
      --line: rgba(255, 255, 255, 0.1); --line-strong: rgba(255, 255, 255, 0.19);
      --accent: #7c7cf1; --accent-ink: #0b0b0e; --accent-wash: rgba(124, 124, 241, 0.16);
      --danger: #ef6469; --ok: #54c08a; --gold: #e8b54a;
      --evil: #54545e; --evil-bg: #1a1a20;
      --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 1px 3px rgba(0, 0, 0, 0.4), 0 20px 54px rgba(0, 0, 0, 0.55);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0b0b0e; --surface: #151519; --surface-2: #101014;
    --ink: #f1f1f4; --ink-2: #afafbb; --muted: #7a7a88;
    --line: rgba(255, 255, 255, 0.1); --line-strong: rgba(255, 255, 255, 0.19);
    --accent: #7c7cf1; --accent-ink: #0b0b0e; --accent-wash: rgba(124, 124, 241, 0.16);
    --danger: #ef6469; --ok: #54c08a; --gold: #e8b54a;
    --evil: #54545e; --evil-bg: #1a1a20;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.35);
    --shadow-lg: 0 1px 3px rgba(0, 0, 0, 0.4), 0 20px 54px rgba(0, 0, 0, 0.55);
  }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--ink-2); font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
  h1, h2, h3 { margin: 0; color: var(--ink); text-wrap: balance; }
  p { margin: 0; }
  button { font: inherit; }
  .mono { font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }

  .hud { position: sticky; top: 0; z-index: 20; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
  .hud-hidden { display: none; }
  .hud-in { max-width: 480px; margin: 0 auto; padding: 10px 16px; display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 14px; }
  .hud-sound { background: none; border: 0; padding: 0; cursor: pointer; font-size: 13px; line-height: 1; filter: grayscale(0.3); opacity: 0.8; transition: opacity 0.15s ease; }
  .hud-sound.is-off { filter: grayscale(1); opacity: 0.45; }
  .hud-sound:hover { opacity: 1; }
  .hud-brand { display: inline-flex; align-items: center; gap: 6px; font-weight: 600; font-size: 13px; color: var(--ink); white-space: nowrap; }
  .hud-glyph { width: 17px; height: 17px; border-radius: 5px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: "Spectral", serif; font-size: 11px; font-weight: 600; }
  .hud-stats { font-size: 11px; color: var(--muted); display: inline-flex; gap: 5px; white-space: nowrap; }
  .hud-time.hud-pen { animation: penalty 0.5s ease; color: var(--danger); }
  @keyframes penalty { 0% { transform: translateY(-3px); opacity: 0.4; } 100% { transform: translateY(0); opacity: 1; } }

  .stage { max-width: 480px; margin: 0 auto; padding: 22px 16px 96px; }
  .screen { display: flex; flex-direction: column; gap: 16px; animation: rise 0.28s ease both; }
  @keyframes rise { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .screen-title { font-family: "Spectral", Georgia, serif; font-weight: 600; font-size: 24px; letter-spacing: -0.01em; }
  .muted-line { font-size: 12.5px; color: var(--muted); margin-top: -8px; }
  .group-label { font-family: "JetBrains Mono", monospace; font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin: 4px 0 -6px; }

  .list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 13px 14px; font-size: 14px; color: var(--ink); background: none; border: 0; border-top: 1px solid var(--line); text-align: left; cursor: pointer; }
  .row:first-child { border-top: 0; }
  .row:hover { background: var(--surface-2); }
  .chev { color: var(--muted); font-size: 15px; }
  .settings-footer { display: flex; flex-direction: column; gap: 8px; align-items: center; margin-top: 18px; font-size: 11px; color: var(--muted); }

  .link-evil { background: none; border: 0; padding: 4px; cursor: pointer; color: var(--evil); font-size: 12px; text-decoration: underline; }
  .link-evil.is-loud { color: var(--danger); font-weight: 500; }
  .link-block { display: block; width: 100%; text-align: center; margin-top: 10px; }
  .link-quiet { align-self: center; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 12.5px; text-decoration: underline; margin-top: 26px; }

  .btn { font-weight: 500; font-size: 14px; padding: 11px 18px; border-radius: var(--r-ctl); border: 1px solid transparent; cursor: pointer; transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease; }
  .btn:active { transform: translateY(1px); }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-primary { background: var(--accent); color: var(--accent-ink); }
  .btn-primary:hover:not(:disabled) { background: color-mix(in srgb, var(--accent) 88%, black); }
  .btn-ghost { background: transparent; border-color: var(--line-strong); color: var(--ink); }
  .btn-block { display: block; width: 100%; }
  .btn-quiet { background: transparent; border-color: var(--line); color: var(--muted); font-size: 12.5px; font-weight: 400; padding: 9px 14px; }
  .btn-quiet:hover:not(:disabled) { color: var(--ink-2); border-color: var(--line-strong); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 22px; box-shadow: var(--shadow-sm); }

  .cookie-slot { margin-top: 6px; }
  .cookie { background: var(--surface); border: 1px solid var(--line-strong); border-radius: var(--r-card); padding: 20px; box-shadow: var(--shadow-lg); display: flex; flex-direction: column; gap: 10px; }
  .cookie h3 { font-size: 16px; }
  .cookie p { font-size: 13px; }
  .cookie-actions { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-top: 6px; }

  .sheet-wrap { min-height: 340px; display: flex; align-items: flex-end; background: var(--evil-bg); border-radius: 18px; padding: 40px 10px 0; }
  .sheet { width: 100%; background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 18px 18px 0 0; padding: 14px 18px 22px; box-shadow: 0 -14px 44px rgba(20, 20, 45, 0.14); display: flex; flex-direction: column; }
  .handle { width: 34px; height: 4px; border-radius: 2px; background: var(--line-strong); margin: 0 auto 14px; }
  .sheet h3 { font-size: 17px; margin-bottom: 6px; }
  .sheet p { font-size: 12.5px; margin-bottom: 16px; }

  .offer { position: relative; display: flex; flex-direction: column; gap: 12px; }
  .offer-badge { position: absolute; top: -12px; right: 16px; background: var(--accent); color: var(--accent-ink); font-weight: 600; font-size: 13px; padding: 4px 10px; border-radius: 999px; }
  .offer h3 { font-size: 16px; }
  .offer p { font-size: 13px; }
  .offer-opts { display: flex; flex-direction: column; gap: 8px; }

  .opt { display: flex; align-items: flex-start; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 13.5px; color: var(--ink); cursor: pointer; }
  .opt:hover { border-color: var(--line-strong); }
  .opt input { accent-color: var(--accent); width: 16px; height: 16px; margin-top: 2px; flex: none; }
  .opt.sel { border-color: var(--accent); background: var(--accent-wash); }

  .survey { display: flex; flex-direction: column; gap: 14px; }
  .q { border: 0; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .q legend { font-size: 13.5px; font-weight: 500; color: var(--ink); padding: 0; margin-bottom: 2px; }
  .q-opts { display: flex; flex-direction: column; gap: 6px; }
  .input { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface-2); border: 1px solid var(--line-strong); border-radius: 10px; padding: 10px 12px; width: 100%; }
  .input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-wash); }
  textarea.input { resize: vertical; }
  .counter { align-self: flex-end; font-family: "JetBrains Mono", monospace; font-size: 11px; color: var(--muted); }
  .counter.ok { color: var(--ok); }

  .chat-head { display: flex; align-items: center; gap: 10px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
  .chat-ava { width: 34px; height: 34px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-weight: 600; font-size: 14px; }
  .chat-head b { color: var(--ink); font-size: 14px; display: block; }
  .chat-status { font-size: 11px; color: var(--ok); }
  .chat { display: flex; flex-direction: column; gap: 8px; min-height: 240px; max-height: 46vh; overflow-y: auto; padding: 12px 2px; }
  .bubble { max-width: 82%; padding: 9px 13px; border-radius: 15px; font-size: 13px; line-height: 1.5; }
  .bubble.bot { align-self: flex-start; background: var(--surface-2); border: 1px solid var(--line); color: var(--ink); border-bottom-left-radius: 5px; }
  .bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 5px; word-break: break-word; }
  .chat-kb { margin: 8px 0; padding-left: 18px; display: flex; flex-direction: column; gap: 5px; }
  .chat-kb li { font-size: 12px; line-height: 1.4; }
  .chat-kb a { color: var(--accent); text-decoration: underline; }
  .chat-kb span { color: var(--muted); font-size: 11px; }
  .typing { align-self: flex-start; display: flex; gap: 4px; padding: 11px 13px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 15px; }
  .typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); animation: bob 1.2s infinite ease-in-out; }
  .typing i:nth-child(2) { animation-delay: 0.15s; }
  .typing i:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bob { 0%, 60%, 100% { opacity: 0.3; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }
  .chat-input { display: flex; gap: 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  .chat-input .input { flex: 1; }
  .chat-input .btn { flex: none; padding: 10px 16px; }

  .toast-host { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 60; width: min(340px, 90vw); }
  .toast { display: flex; align-items: flex-start; gap: 10px; background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow-lg); border-radius: 12px; padding: 11px 14px; font-size: 12.5px; color: var(--ink-2); animation: toast-in 0.3s ease both; }
  .toast p { margin: 0; }
  .toast-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); margin-top: 5px; flex: none; }
  .toast-out { animation: toast-out 0.32s ease forwards; }
  @keyframes toast-in { from { opacity: 0; transform: translateY(8px); } }
  @keyframes toast-out { to { opacity: 0; transform: translateY(8px); } }

  .intro { align-items: stretch; gap: 18px; padding-top: 26px; }
  .intro-brand { display: inline-flex; align-items: center; gap: 7px; align-self: center; font-weight: 600; font-size: 13px; color: var(--ink-2); }
  .intro-glyph { width: 20px; height: 20px; border-radius: 6px; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; font-family: "Spectral", serif; font-size: 13px; font-weight: 600; }
  .intro h1 { font-family: "Spectral", Georgia, serif; font-weight: 600; font-size: 40px; letter-spacing: -0.02em; text-align: center; margin: -2px 0 0; }
  .intro-lede { display: flex; flex-direction: column; gap: 10px; font-size: 14.5px; line-height: 1.55; color: var(--ink-2); }
  .intro-rules { display: flex; flex-direction: column; gap: 8px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface-2); font-size: 12.5px; line-height: 1.5; color: var(--muted); }
  .intro-rules p::before { content: "— "; }
  .intro .btn { margin-top: 4px; }
  .intro-note { font-size: 10.5px; color: var(--muted); text-align: center; line-height: 1.4; margin-top: 2px; }
  .colophon { align-self: center; color: var(--muted); font-size: 11px; text-decoration: none; border-bottom: 1px solid var(--line-strong); padding-bottom: 1px; margin-top: -6px; transition: color 0.15s ease, border-color 0.15s ease; }
  .colophon:hover { color: var(--ink-2); border-color: var(--ink-2); }

  .end { align-items: stretch; text-align: center; gap: 22px; }
  .end-hero { display: flex; flex-direction: column; gap: 10px; padding: 12px 0 4px; }
  .end-emoji { font-size: 46px; }
  .end h1 { font-family: "Spectral", Georgia, serif; font-weight: 600; font-size: 28px; }
  .end-sub { font-size: 13.5px; color: var(--ink-2); max-width: 34ch; margin: 0 auto; }
  .gift { display: flex; flex-direction: column; gap: 14px; align-items: center; }
  .gift-kicker { font-family: "JetBrains Mono", monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--gold); }
  .gift h3 { font-size: 15px; }
  .wheel-box { position: relative; width: 260px; max-width: 100%; aspect-ratio: 1; margin: 4px 0; }
  .wheel-pin { position: absolute; top: -4px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 11px solid transparent; border-right: 11px solid transparent; border-top: 18px solid var(--ink); z-index: 2; filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.25)); }
  .wheel { width: 100%; height: 100%; border-radius: 50%; box-shadow: var(--shadow-lg); transition: transform 4s cubic-bezier(0.15, 0.85, 0.25, 1); }
  .wheel-svg { width: 100%; height: 100%; display: block; }
  .wheel-label { font-family: "Inter", sans-serif; font-size: 7.5px; font-weight: 600; fill: #ffffff; letter-spacing: -0.1px; }
  .wheel-label.is-jackpot { fill: #3a2a05; }
  .prize { width: 100%; display: flex; flex-direction: column; gap: 12px; padding-top: 4px; border-top: 1px solid var(--line); }
  .prize-row { display: flex; gap: 12px; align-items: center; text-align: left; }
  .prize-emoji { font-size: 28px; flex: none; }
  .prize-row b { color: var(--ink); font-size: 14px; display: block; }
  .prize-row span { font-size: 12px; color: var(--muted); }
  .thanks { display: flex; flex-direction: column; gap: 8px; align-items: center; padding: 10px 0; }
  .thanks-emoji { font-size: 34px; }
  .thanks h3 { font-size: 17px; }
  .thanks p { font-size: 13px; color: var(--ink-2); max-width: 32ch; }

  .captcha { padding: 0; overflow: hidden; }
  .captcha-head { background: var(--accent); color: #fff; padding: 14px 16px; display: flex; flex-direction: column; gap: 2px; }
  .captcha-head span { font-size: 12px; opacity: 0.9; }
  .captcha-head b { font-size: 18px; font-weight: 600; }
  .captcha-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; background: var(--line); padding: 3px; }
  .captcha-tile { aspect-ratio: 1; border: 0; cursor: pointer; background: var(--surface-2); color: var(--ink); display: grid; place-items: center; position: relative; transition: background 0.12s ease; }
  .captcha-tile svg { width: 46%; height: 46%; }
  .captcha-tile.on { background: var(--accent); color: #fff; }
  .captcha-tile.on::after { content: "✓"; position: absolute; top: 3px; left: 6px; font-weight: 700; font-size: 13px; }
  .captcha-foot { padding: 14px 16px 16px; display: flex; flex-direction: column; align-items: center; gap: 10px; }

  .terms { height: 240px; overflow-y: auto; padding: 14px 16px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; font-size: 12.5px; line-height: 1.6; color: var(--ink-2); display: flex; flex-direction: column; gap: 10px; overscroll-behavior: contain; }
  .terms p { margin: 0; }
  .terms-end { color: var(--muted); text-align: center; font-family: "JetBrains Mono", monospace; font-size: 11px; transition: color 0.2s ease; }
  .terms-end.lit { color: var(--ok); }
  .terms-quiz { display: flex; flex-direction: column; gap: 6px; }
  .terms-quiz .opt { font-size: 12.5px; line-height: 1.4; transition: border-color 0.15s ease, background 0.15s ease; }
  .terms-quiz .opt.is-wrong { border-color: var(--danger); background: color-mix(in srgb, var(--danger) 9%, transparent); animation: shake 0.3s ease; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }

  .maze { display: grid; gap: 2px; width: min(320px, 100%); margin: 4px auto; touch-action: none; user-select: none; }
  .maze .mcell { aspect-ratio: 1; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); }
  .maze .mcell[data-role="wall"] { background: var(--ink); border-color: var(--ink); }
  .maze .mcell[data-role="start"] { background: var(--accent); border-color: var(--accent); }
  .maze .mcell[data-role="end"] { background: var(--ok); border-color: var(--ok); }
  .maze .mcell.lit { background: var(--accent-wash); border-color: var(--accent); }
  .maze.tracing { cursor: crosshair; }
  .maze.maze-done .mcell:not([data-role="wall"]) { background: var(--ok); border-color: var(--ok); }

  .svc-list { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
  .svc-row { display: flex; align-items: center; gap: 12px; padding: 13px 14px; border-top: 1px solid var(--line); }
  .svc-row:first-child { border-top: 0; }
  .svc-row.is-off { opacity: 0.55; }
  .svc-row.is-cloud { flex-direction: column; align-items: stretch; gap: 10px; }
  .svc-row.is-cloud .svc-ctl { display: none; }
  .svc-info { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .svc-info b { font-size: 14px; color: var(--ink); }
  .svc-info span { font-size: 11.5px; color: var(--muted); }
  .svc-ctl { flex: none; }
  .svc-btn { padding: 7px 14px; font-size: 13px; }
  .svc-check { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--ok); color: #fff; font-size: 14px; font-weight: 700; }
  .svc-cloud { width: 100%; display: flex; flex-direction: column; gap: 8px; }
  .svc-cloud > p { font-size: 12px; color: var(--ink-2); }
  .svc-cloud-btns { display: flex; flex-wrap: wrap; gap: 6px; }
  .svc-cloud-btns .btn { flex: 1 1 140px; padding: 8px 10px; font-size: 12.5px; }
  .svc-bar { width: 100%; height: 8px; border-radius: 999px; background: var(--evil-bg); overflow: hidden; }
  .svc-bar > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width 0.2s ease; }

  .call { border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: var(--surface); }
  .call-incoming { display: none; flex-direction: column; align-items: center; gap: 6px; padding: 28px 18px 22px; text-align: center; }
  .call-incoming:not([hidden]) { display: flex; }
  .call-avatar { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: var(--accent); color: #fff; font-family: "Spectral", Georgia, serif; font-size: 26px; font-weight: 600; animation: call-pulse 1.8s ease-in-out infinite; }
  @keyframes call-pulse { 0%, 100% { box-shadow: 0 0 0 0 var(--accent-wash); } 50% { box-shadow: 0 0 0 12px transparent; } }
  .call-incoming b { font-size: 17px; }
  .call-incoming > span { font-size: 12px; color: var(--muted); }
  .call-incoming-btns { display: flex; gap: 10px; margin-top: 12px; }
  .call-btn { border: 0; border-radius: 999px; padding: 10px 20px; font-size: 13px; font-weight: 500; cursor: pointer; }
  .call-accept { background: var(--ok); color: #fff; }
  .call-decline { background: var(--danger); color: #fff; }

      return function () { timers.forEach(clearTimeout); };
    } };

    var levels = [level01, level02, level03, level04, level05, level06, level07, level08, level09, level10, level11, level12, level13, level14, level15, level16, level17, level18, level19, level20, ending];

    // ---------- cross-level twists ----------
    var TWISTS = [
      { before: 4, render: function (root, done) {
        var view = el(
          '<div class="screen"><div class="twist"><div class="twist-emoji">🎉</div>' +
          '<h1 class="screen-title">«Инопоиск Флюс» обновился</h1>' +
          '<p class="muted-line">Версия 8.15.0 · только что</p>' +
          '<ul class="twist-list"><li>Новый способ не отменять подписку</li>' +
          '<li>Кнопка отмены стала на 12% незаметнее</li>' +
          '<li>Исправлена ошибка, из-за которой отмена иногда срабатывала</li>' +
          '<li>Прочие улучшения, о которых вам не нужно знать</li></ul>' +
          '<button class="btn btn-primary btn-block" type="button" data-go>Продолжить</button></div></div>'
        );
        view.querySelector("[data-go]").addEventListener("click", done);
        root.appendChild(view);
      } },
      { before: 9, render: function (root, done, game) {
        var view = el(
          '<div class="screen"><div class="twist"><div class="twist-emoji">🔒</div>' +
          '<h1 class="screen-title">Сессия завершена</h1>' +
          '<p class="muted-line">Для вашей безопасности мы вышли из аккаунта. Войдите снова, чтобы продолжить отмену.</p>' +
          '<div class="twist-login"><input class="input" value="m•••@mail.ru" disabled aria-label="Почта" />' +
          '<button class="btn btn-primary btn-block" type="button" data-in>Войти</button></div></div></div>'
        );
        var btn = view.querySelector("[data-in]");
        btn.addEventListener("click", function () {
          btn.disabled = true; btn.textContent = "Входим…";
          game.penalize(3000);
          setTimeout(done, 1500);
        });
        root.appendChild(view);
      } },
      { before: 12, render: function (root, done) {
        var view = el(
          '<div class="screen"><div class="twist"><div class="twist-emoji">🌙</div>' +
          '<h1 class="screen-title">Мы включили тёмную тему</h1>' +
          '<p class="muted-line">Подобрали по времени суток и по тому, как долго вы уже здесь. Светлую вернём попозже.</p>' +
          '<button class="btn btn-primary btn-block" type="button" data-ok>Ладно</button></div></div>'
        );
        view.querySelector("[data-ok]").addEventListener("click", function () {
          document.documentElement.setAttribute("data-theme", "dark");
          done();
        });
        root.appendChild(view);
      } },
      { before: 15, render: function (_root, done) {
        document.documentElement.setAttribute("data-theme", "light");
        toast("Вернули светлую тему. Глаза, наверное, уже привыкли.");
        done();
      } },
    ];

    // ---------- game ----------
    var DEFAULT_FAIL = "Спасибо, что согласились не отменять подписку. Повезёт в другой раз.";
    function Game(stage, hud) {
      this.stage = stage; this.hud = hud;
      this.index = 0; this.clickCount = 0; this.penaltyMs = 0;
      this.startedAt = 0;
      this.cleanup = null;
      this.twistDone = {};
      var self = this;
      this.complete = function () {
        if (self.index >= levels.length - 1) return;
        self.index += 1;
        sfx.blip();
        var twist = null;
        for (var k = 0; k < TWISTS.length; k++) if (TWISTS[k].before === self.index) twist = TWISTS[k];
        if (twist && !self.twistDone[self.index]) {
          self.twistDone[self.index] = true;
          self.runTwist(twist);
        } else {
          self.mountCurrent();
        }
      };
      this.runTwist = function (twist) {
        if (self.cleanup) { self.cleanup(); self.cleanup = null; }
        self.stage.replaceChildren();
        self.hud.setVisible(true);
        var cl = twist.render(self.stage, function () { self.mountCurrent(); }, self);
        self.cleanup = typeof cl === "function" ? cl : null;
        window.scrollTo({ top: 0 });
      };
      this.fail = function (message) {
        sfx.fail();
        if (self.cleanup) { self.cleanup(); self.cleanup = null; }
        self.stage.replaceChildren();
        var clicks = self.clickCount;
        var overlay = el(
          '<div class="gameover" role="alertdialog" aria-modal="true"><div class="gameover-card">' +
          '<div class="gameover-emoji">🙃</div><h2>Спасибо, что согласились не отменять подписку</h2>' +
          "<p>" + (message || DEFAULT_FAIL) + "</p>" +
          '<p class="gameover-stat mono">на счётчике уже ' + mmss(self.elapsed()) + " и " + clicks + " " + plural(clicks, "клик", "клика", "кликов") + "</p>" +
          '<button class="btn btn-primary btn-block" type="button" data-restart>Начать заново</button></div></div>'
        );
        overlay.querySelector("[data-restart]").addEventListener("click", function () {
          overlay.remove();
          document.documentElement.removeAttribute("data-theme");
          self.index = 0; self.mountCurrent();
        });
        document.body.appendChild(overlay);
      };
      this._countClick = function () { self.clickCount += 1; self.hud.setClicks(self.clickCount); };
      this._loop = function () { self.hud.tick(self.elapsed()); requestAnimationFrame(self._loop); };
    }
    Game.prototype.elapsed = function () { return performance.now() - this.startedAt + this.penaltyMs; };
    Game.prototype.clicks = function () { return this.clickCount; };
    Game.prototype.penalize = function (ms) { this.penaltyMs += ms; this.hud.flashPenalty(); };
    Game.prototype.start = function (fromIndex) {
      if (fromIndex >= 1 && fromIndex <= levels.length - 1) {
        this.index = fromIndex;
        this.begin();
        return;
      }
      this.mountIntro();
    };
    Game.prototype.mountIntro = function () {
      if (this.cleanup) { this.cleanup(); this.cleanup = null; }
      this.hud.setVisible(false);
      this.stage.replaceChildren();
      var self = this;
      var view = el(
        '<div class="screen intro">' +
        '<div class="intro-brand"><span class="intro-glyph">и</span>Инопоиск&nbsp;Флюс</div>' +
        '<h1>Отписаться</h1>' +
        '<div class="intro-lede">' +
        '<p>Вы платите за подписку «Флюс» 399&nbsp;₽ в месяц. Когда вы ей пользовались в последний раз — честно, не вспомнить.</p>' +
        '<p>Сегодня вы её отменяете. Между вами и кнопкой отмены — только их интерфейс. Ничего сложного.</p></div>' +
        '<div class="intro-rules"><p>Время и клики считаются с момента старта.</p>' +
        '<p>Согласитесь оставить подписку — начнёте сначала. Счётчик при этом не остановится.</p></div>' +
        '<button class="btn btn-primary btn-block" type="button" data-begin>Начать отмену</button>' +
        '<p class="intro-note">Пародия. «Инопоиск Флюс» — вымышленный сервис, совпадения с реальными компаниями случайны.</p>' +
        '<a class="colophon" href="https://vonzvyagin.ru">Женя Звягин · vonzvyagin.ru</a>' +
        '</div>'
      );
      view.querySelector("[data-begin]").addEventListener("click", function () { self.begin(); });
      this.stage.appendChild(view);
      window.scrollTo({ top: 0 });
    };
    Game.prototype.begin = function () {
      if (this.startedAt === 0) {
        this.startedAt = performance.now();
        document.addEventListener("click", this._countClick, true);
        this._loop();
      }
      this.mountCurrent();
    };
    Game.prototype.mountCurrent = function () {
      if (this.cleanup) { this.cleanup(); this.cleanup = null; }
      this.stage.replaceChildren();
      var level = levels[this.index];
      var isEnding = this.index === levels.length - 1;
      this.hud.setVisible(!isEnding);
      var c = level.mount(this.stage, this);
      this.cleanup = typeof c === "function" ? c : null;
      window.scrollTo({ top: 0 });
    };

    var hud = new Hud(document.getElementById("hud"));
    var game = new Game(document.getElementById("stage"), hud);
    // dev: open #7 to start on level 7 (1-based). No hash → intro screen.
    var startAt = parseInt((location.hash || "").slice(1), 10);
    game.start(startAt >= 1 && startAt <= levels.length ? startAt - 1 : 0);

    // Консольные хелперы: __ipp.goto(n) / __ipp.twist(i) / __ipp.intro(). Невидимы игроку.
    window.__ipp = {
      game: game,
      goto: function (n) { document.documentElement.removeAttribute("data-theme"); game.index = n - 1; game.startedAt === 0 ? game.begin() : game.mountCurrent(); },
      twist: function (before) { for (var k = 0; k < TWISTS.length; k++) if (TWISTS[k].before === before) game.runTwist(TWISTS[k]); },
      intro: function () { document.documentElement.removeAttribute("data-theme"); game.index = 0; game.mountIntro(); },
    };

    // Видимый переключатель уровней — только по ?dev в адресе.
    if (/[?&]dev(\b|=)/.test(location.search)) {
      document.querySelector(".preview-flag").hidden = false;
      document.getElementById("lvlnav").hidden = false;
      buildLevelNav();
    }

    function buildLevelNav() {
      var NAMES = [
        "Настройки", "Cookie-баннер", "«Уже уходите?»", "Скидка −75%", "Опрос",
        "Чат-бот Стеша", "Капча", "Ожидание оператора", "SMS-код", "Пятнашки",
        "Ползунок", "Условия", "Лабиринт", "Отключить услуги", "Звонок основателя",
        "Понижение тарифа", "Почерк", "Удержать кнопку", "Точность", "Готово… почти",
        "Финал · колесо",
      ];
      var grid = document.getElementById("lvlnav-grid");
      var btns = [];
      NAMES.forEach(function (name, i) {
        var b = el('<button type="button">' + (i + 1) + ". " + name + "</button>");
        b.addEventListener("click", function () { document.documentElement.removeAttribute("data-theme"); game.index = i; game.startedAt === 0 ? game.begin() : game.mountCurrent(); });
        btns.push(b);
        grid.appendChild(b);
      });
      var origMount = game.mountCurrent.bind(game);
      game.mountCurrent = function () {
        origMount();
        btns.forEach(function (b, i) { b.classList.toggle("on", i === game.index); });
      };
      btns.forEach(function (b, i) { b.classList.toggle("on", i === game.index); });
    }
  })();
</script>

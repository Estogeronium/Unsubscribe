    <!-- Плашка про куки — статичная, вне движка игры -->
    <style>
      .cookie-nag {
        position: fixed;
        left: 50%;
        bottom: 16px;
        transform: translateX(-50%);
        z-index: 100;
        width: min(430px, calc(100% - 32px));
        display: none;
        align-items: center;
        gap: 12px;
        padding: 12px 14px;
        background: #1a1a23;
        color: #fff;
        border-radius: 12px;
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        font-size: 13px;
        line-height: 1.4;
        box-shadow: 0 10px 34px rgba(20, 20, 45, 0.3);
        animation: cookie-rise 0.35s ease;
      }
      .cookie-nag:not([hidden]) {
        display: flex;
      }
      @keyframes cookie-rise {
        from {
          opacity: 0;
          transform: translate(-50%, 8px);
        }
      }
      .cookie-nag p {
        flex: 1;
        margin: 0;
      }
      .cookie-nag button {
        flex: none;
        border: 0;
        background: #fff;
        color: #1a1a23;
        font: inherit;
        font-weight: 500;
        padding: 6px 16px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .cookie-nag button:hover {
        background: #e3e3ea;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>

    <div class="cookie-nag" id="cookieNag" role="note" hidden>
      <p>Ну собираю я куки. И что ты мне сделаешь?</p>
      <button type="button" id="cookieOk">ОК</button>
    </div>
    <script>
      (function () {
        var KEY = "ipp-cookie-ack";
        var nag = document.getElementById("cookieNag");
        try {
          if (localStorage.getItem(KEY)) return;
        } catch (e) {}
        nag.hidden = false;
        document.getElementById("cookieOk").addEventListener("click", function () {
          nag.hidden = true;
          try {
            localStorage.setItem(KEY, "1");
          } catch (e) {}
        });
      })();
    </script>

    <script type="module" src="/src/main.ts"></script>
  </body>
